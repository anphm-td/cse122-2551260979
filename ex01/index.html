<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BỐN MÙA</title>
    <style>
        :root{
            --background: #fffde7;
            --grey: #9e9e9e;
            --red: #d40000;
            --pink: #ffd9e6;
            --blue: #0033cc;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Times New Roman', sans-serif;
        }
        .khung-tho {
            background-color: var(--background);
            border: 1px solid var(--grey);
            width: 640px;
            padding: 24px;
            text-align: center;

        }
        h1 {
            color:  var(--red);
            background-color: var(--pink);
            font-size: 26px;
            padding: 6px 0; 
            margin: 0 0 20px;
            font-weight: bold;
        }
        .kho {
            font-style: italic;
            line-height: 1.7;
        }
        .xanh {
            color: var(--blue);
        }
        .do {
            color: var(--red);
        }
        hr {
            width: 55%;
            border: none;
            border-top: 1px solid var(--blue);
        }
    </style>
</head>
<body>
    <article class="khung-tho">
    <h1>BỐN MÙA</h1>
        <p class="kho xanh">
            Xuân về hoa nở khắp trời<br>
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rung bên thềm
        </p>
        <hr>
        <p class="kho do">
            Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai
        </p>
        <hr>
        <p class="kho xanh">
            Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường
        </p> 

    </article>

</body>
</html>
